<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zinnenmuur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#f6f3ee; --surface:#ffffff; --ink:#1d1b18; --muted:#6b655c; --line:#e3ddd3;
  --accent:#c2410c; --accent-ink:#ffffff; --soft:#fde9dc; --ok:#15803d;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16140f; --surface:#211e18; --ink:#f3efe7; --muted:#a49c8f; --line:#38332a;
    --accent:#fb923c; --accent-ink:#1d1b18; --soft:#3a2617; --ok:#4ade80;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#16140f; --surface:#211e18; --ink:#f3efe7; --muted:#a49c8f; --line:#38332a;
  --accent:#fb923c; --accent-ink:#1d1b18; --soft:#3a2617; --ok:#4ade80;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;line-height:1.4;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* ---------- SCHERM ---------- */
.screen{display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:100vh}
.screen.noqr{grid-template-columns:minmax(0,1fr)}
.wallwrap{padding:28px 32px 90px;min-width:0}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.prompt{flex:1;min-width:240px;font-size:clamp(26px,3.2vw,44px);font-weight:700;outline:none;border-bottom:2px dashed transparent;padding:2px 0}
.prompt:focus{border-bottom-color:var(--line)}
.prompt:empty::before{content:attr(data-ph);color:var(--muted);font-weight:400}
.count{font-size:20px;color:var(--muted);white-space:nowrap}
.count b{color:var(--accent);font-size:28px}
.wall{columns:3 300px;column-gap:18px}
.card{break-inside:avoid;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px 12px;margin:0 0 18px;box-shadow:var(--shadow);position:relative;animation:pop .5s ease-out}
.card .z{font-size:clamp(20px,1.9vw,30px);overflow-wrap:anywhere}
.card .n{font-size:15px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between;gap:8px}
.card .acts{opacity:0;transition:opacity .15s;display:flex;gap:4px}
.card:hover .acts,.card:focus-within .acts{opacity:1}
.card .acts button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:2px 8px;font-size:13px}
.card.star{border-color:var(--accent);background:var(--soft)}
.card.new{outline:3px solid var(--accent);outline-offset:-1px}
@keyframes pop{from{transform:translateY(-10px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.empty{border:2px dashed var(--line);border-radius:16px;padding:48px 24px;text-align:center;color:var(--muted);font-size:22px}
.nonames .card .who{display:none}

.side{background:var(--surface);border-left:1px solid var(--line);padding:26px 24px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh}
.side h2{margin:0;font-size:22px}
.qr{background:#fff;padding:14px;border-radius:14px;align-self:center;border:1px solid var(--line)}
.qr img,.qr canvas{display:block;width:230px!important;height:230px!important}
.howto{font-size:17px;color:var(--muted);margin:0}
.code{font-size:13px;color:var(--muted);word-break:break-all}
.warn{background:var(--soft);border:1px solid var(--accent);border-radius:10px;padding:10px 12px;font-size:14px}
.warn input{width:100%;margin-top:6px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.status{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:auto}
.dot{width:9px;height:9px;border-radius:50%;background:#aaa}
.dot.on{background:var(--ok)}

.bar{position:fixed;left:16px;bottom:16px;display:flex;gap:8px;flex-wrap:wrap;z-index:5}
.bar button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;box-shadow:var(--shadow)}
.bar button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.spot{position:fixed;inset:0;background:rgba(10,8,5,.82);display:flex;align-items:center;justify-content:center;padding:6vw;z-index:20}
.spot div{background:var(--surface);border-radius:22px;padding:5vw;max-width:1300px;width:100%}
.spot p{margin:0;font-size:clamp(32px,5vw,72px);font-weight:700;line-height:1.25}
.spot small{display:block;margin-top:24px;color:var(--muted);font-size:20px}
.spot p[contenteditable]{outline:none}

/* ---------- CURSIST ---------- */
.phone{max-width:560px;margin:0 auto;padding:22px 16px 40px}
.phone h1{font-size:24px;margin:0 0 4px}
.task{background:var(--soft);border-radius:14px;padding:14px 16px;font-size:20px;font-weight:700;margin:14px 0 18px}
.task:empty{display:none}
label{display:block;font-size:15px;color:var(--muted);margin:14px 0 6px}
.phone input,.phone textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);font-size:19px}
.phone textarea{min-height:130px;resize:vertical}
.phone input:focus,.phone textarea:focus{outline:none;border-color:var(--accent)}
.send{width:100%;margin-top:16px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:15px;font-size:20px;font-weight:700}
.send:disabled{opacity:.5}
.msg{margin-top:14px;font-size:17px;min-height:24px}
.msg.ok{color:var(--ok)} .msg.err{color:var(--accent)}
.mine{margin-top:22px;border-top:1px solid var(--line);padding-top:12px}
.mine p{margin:6px 0;color:var(--muted);font-size:16px}
.starters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 4px}
.starters button{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:8px 13px;font-size:16px}
.starters .grp{flex-basis:100%;font-size:13.5px;font-weight:700;color:var(--muted);margin-top:6px}
.starters button:active{border-color:var(--accent);background:var(--soft)}

@media (max-width:820px){
  .screen{grid-template-columns:1fr}
  .side{position:static;height:auto;border-left:0;border-top:1px solid var(--line)}
  .wallwrap{padding:20px 16px 90px}
}
</style>
</head>
<body>

<!-- ===== SCHERM (leerkracht / projectie) ===== -->
<main id="screen" class="screen hidden">
  <section class="wallwrap">
    <div class="head">
      <div id="prompt" class="prompt" contenteditable="true" spellcheck="false" data-ph="Klik hier en typ de opdracht…"></div>
      <div class="count"><b id="count">0</b> <span id="tMeerv">zinnen</span></div>
    </div>
    <div id="wall" class="wall"></div>
    <div id="empty" class="empty"></div>
  </section>
  <aside id="side" class="side">
    <h2 id="tKop"></h2>
    <div class="qr" id="qr"></div>
    <p class="howto" id="tHowto"></p>
    <div id="filewarn" class="warn hidden">
      Dit bestand staat nog niet online, dus de QR werkt niet op gsm's. Plak hier het webadres waar je het gezet hebt:
      <input id="baseurl" placeholder="https://…/index.html">
    </div>
    <div class="code" id="link"></div>
    <div class="status"><span class="dot" id="dot"></span><span id="stat">Verbinden…</span></div>
  </aside>
  <nav class="bar">
    <button id="bQr" class="on">QR</button>
    <button id="bNames" class="on">Namen</button>
    <button id="bPause">Pauze</button>
    <button id="bFull">Volledig scherm</button>
    <button id="bCopy">Kopieer alles</button>
    <button id="bClear">Muur leegmaken</button>
    <button id="bNew">Nieuwe sessie</button>
  </nav>
</main>
<div id="spot" class="spot hidden"><div><p id="spotText" contenteditable="true" spellcheck="false"></p><small>Klik in de zin om samen te verbeteren · Esc of klik buiten de zin om te sluiten</small></div></div>

<!-- ===== CURSIST (gsm) ===== -->
<main id="phone" class="phone hidden">
  <h1 id="tKopGsm"></h1>
  <div class="task" id="task"></div>
  <label for="naam" id="tNaam">Je naam (mag ook leeg)</label>
  <input id="naam" maxlength="40" autocomplete="given-name">
  <div id="startBox" class="hidden"><label id="tStart">Tik op een begin</label><div class="starters" id="starters"></div></div>
  <label for="zin" id="tVeld"></label>
  <textarea id="zin" maxlength="400"></textarea>
  <button class="send" id="send">Versturen</button>
  <div class="msg" id="msg" role="status"></div>
  <div class="mine hidden" id="mineBox"><label id="tMijn"></label><div id="mine"></div></div>
</main>

<script>
(function(){
const RELAY = "https://ntfy.sh/";
const PREFIX = "zinnenmuur-nt2-";
const qs = new URLSearchParams(location.search);
const room = qs.get("r");
const $ = id => document.getElementById(id);
/* Vaste lessen: open het scherm met ?les=<naam>. Zonder ?les blijft het de gewone zinnenmuur. */
const LESSEN = {
  advies: {
    titel:"Adviezenmuur", een:"een advies", het:"je advies", Het:"Je advies", meerv:"adviezen",
    opdracht:"Geef een goed advies over gezonde voeding.",
    startLabel:"Drie manieren (Taalhulp 6) – tik op een begin",
    starters:[
      ["Imperatief (1 werkwoord) – instructie, streng", ["Eet …!","Drink …!","Wees voorzichtig met …","Eet maar …"]],
      ["Modaal werkwoord (2 werkwoorden) – duidelijk, neutraal", ["Je moet …","Je mag niet te veel …","Je kan beter …","Je kan misschien …"]],
      ["Zouden + modaal werkwoord (3 werkwoorden) – voorzichtig, vriendelijk", ["Je zou meer … moeten …","Je zou minder … kunnen …"]]
    ]
  },
  conclusie: {
    titel:"Conclusiemuur", een:"een conclusie", het:"jullie conclusie", Het:"Jullie conclusie", meerv:"conclusies",
    naam:"Jullie namen (mag ook leeg)",
    opdracht:"Lightproducten: wat is jullie conclusie? Is ze hetzelfde in het filmpje en in de tekst?",
    starters:[
      ["Wat zegt het filmpje? Wat zegt de tekst?", ["Volgens het filmpje …","Volgens de tekst …","In het filmpje zeggen ze dat …","In de tekst staat dat …"]],
      ["Hetzelfde of anders?", ["Onze conclusie is hetzelfde: …","Onze conclusie is anders, want …"]],
      ["Jullie conclusie", ["Wij denken dat lightproducten …","Lightproducten zijn (niet) gezonder, want …","Onze conclusie is dat …"]]
    ]
  },
  driehoekboterham: {
    titel:"Conclusiemuur", een:"een conclusie", het:"jullie conclusie", Het:"Jullie conclusie", meerv:"conclusies",
    naam:"Jullie namen (mag ook leeg)",
    opdracht:"De driehoekboterham: wat is jullie conclusie? Is ze hetzelfde in het filmpje en in de tekst?",
    starters:[
      ["Wat zegt het filmpje? Wat zegt de tekst?", ["Volgens het filmpje …","Volgens de tekst …","In het filmpje zeggen ze dat …","In de tekst staat dat …"]],
      ["Hetzelfde of anders?", ["Onze conclusie is hetzelfde: …","Onze conclusie is anders, want …"]],
      ["Jullie conclusie", ["Wij denken dat een driehoekboterham …","Een driehoekboterham is (niet) gezond, want …","Onze conclusie is dat …"]]
    ]
  }
};
const lesId = ({boterham:"driehoekboterham"})[(qs.get("les")||"").toLowerCase()] || (qs.get("les")||"").toLowerCase();
const L = Object.assign({titel:"Zinnenmuur", een:"een zin", het:"je zin", Het:"Je zin", meerv:"zinnen", opdracht:"", starters:[]}, LESSEN[lesId]||{});
const sfx = LESSEN[lesId] ? "_"+lesId : "";
document.title = L.titel;
$("tMeerv").textContent = L.meerv;
$("empty").textContent = "Nog geen "+L.meerv+". Scan de QR-code en stuur "+L.het+"!";
$("tKop").textContent = "Stuur "+L.het;
$("tHowto").innerHTML = "Scan de code met je gsm, typ "+L.het+" en druk op <b>Versturen</b>.";
$("tKopGsm").textContent = "Stuur "+L.het+" ✍️";
$("tVeld").textContent = L.Het;
if(L.naam) $("tNaam").textContent = L.naam;
$("zin").placeholder = "Schrijf hier "+L.het+"…";
$("tMijn").textContent = "Jouw verstuurde "+L.meerv;
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
function rid(n){const a="abcdefghjkmnpqrstuvwxyz23456789";let s="";const r=crypto.getRandomValues(new Uint8Array(n));for(const x of r)s+=a[x%a.length];return s}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function post(topic,obj,title){
  const h={}; if(title) h["Title"]=title;
  const r=await fetch(RELAY+topic,{method:"POST",body:JSON.stringify(obj),headers:h});
  if(!r.ok) throw new Error("HTTP "+r.status);
}
function parse(m){try{return JSON.parse(m.message)}catch(e){return null}}
/* Live via SSE; valt terug op ophalen om de 3 s als SSE geblokkeerd is (schoolnetwerk, proxy). */
function listen(topic,onMsg,onState){
  let es=null,timer=null,since="all",stopped=false,fails=0,mode="sse";
  function track(m){if(m&&m.id)since=m.id}
  async function poll(){
    if(stopped)return;
    try{
      const r=await fetch(RELAY+topic+"/json?poll=1&since="+since,{cache:"no-store"});
      if(!r.ok)throw 0;
      const t=await r.text();
      t.split("\n").forEach(l=>{if(!l.trim())return;const m=JSON.parse(l);if(m.event==="message"){track(m);onMsg(m)}});
      onState("poll");
    }catch(e){onState("down")}
    timer=setTimeout(poll,3000);
  }
  function toPoll(){if(mode==="poll")return;mode="poll";if(es)es.close();poll()}
  try{
    es=new EventSource(RELAY+topic+"/sse?since=all");
    const t0=setTimeout(()=>{if(es.readyState!==1)toPoll()},6000);
    es.onopen=()=>{fails=0;onState("live")};
    es.onerror=()=>{fails++;onState("down");if(fails>=2)toPoll()};
    es.onmessage=e=>{const m=JSON.parse(e.data);if(m.event==="message"){track(m);onMsg(m)}};
  }catch(e){toPoll()}
  return {close(){stopped=true;if(es)es.close();clearTimeout(timer)}};
}

/* ================= CURSIST ================= */
if(room){
  $("phone").classList.remove("hidden");
  const topic=PREFIX+room;
  const naam=$("naam"), zin=$("zin"), btn=$("send"), msg=$("msg");
  naam.value=store.get("zm_naam","");
  const mine=store.get("zm_mine_"+room,[]);
  function showMine(){ if(!mine.length) return; $("mineBox").classList.remove("hidden");
    $("mine").innerHTML=mine.slice().reverse().map(z=>"<p>• "+esc(z)+"</p>").join("") }
  showMine();
  $("task").textContent=L.opdracht;
  if(L.starters.length){
    $("startBox").classList.remove("hidden");
    if(L.startLabel) $("tStart").textContent=L.startLabel;
    $("starters").innerHTML=L.starters.map(g=>"<div class=\"grp\">"+esc(g[0])+"</div>"+g[1].map(t=>"<button type=\"button\">"+esc(t)+"</button>").join("")).join("");
    $("starters").addEventListener("click",e=>{const b=e.target.closest("button"); if(!b) return;
      const begin=b.textContent.split("…")[0];
      const begins=L.starters.flatMap(g=>g[1]).map(t=>t.split("…")[0].trim());
      if(!zin.value.trim()||begins.includes(zin.value.trim())) zin.value=begin;
      zin.focus(); zin.setSelectionRange(zin.value.length,zin.value.length)});
  }
  // opdracht ophalen en live volgen
  listen(topic,m=>{const d=parse(m); if(d&&d.t==="opdracht") $("task").textContent=d.tekst||L.opdracht},()=>{});
  btn.onclick=async()=>{
    const z=zin.value.trim();
    if(!z){msg.className="msg err";msg.textContent="Schrijf eerst "+L.een+".";zin.focus();return}
    btn.disabled=true; msg.className="msg"; msg.textContent="Bezig met versturen…";
    store.set("zm_naam",naam.value.trim());
    try{
      await post(topic,{t:"zin",id:rid(10),naam:naam.value.trim().slice(0,40),zin:z.slice(0,400)});
      mine.push(z); store.set("zm_mine_"+room,mine); showMine();
      zin.value=""; msg.className="msg ok"; msg.textContent="Verstuurd ✓ "+L.Het+" staat op het scherm. Je mag nog "+L.een+" sturen.";
    }catch(e){ msg.className="msg err"; msg.textContent="Dat lukte niet. Controleer je internet en probeer opnieuw."; }
    btn.disabled=false;
  };
  return;
}

/* ================= SCHERM ================= */
$("screen").classList.remove("hidden");
let code=store.get("zm_room"+sfx,null);
if(!code){code=rid(10);store.set("zm_room"+sfx,code)}
let topic=PREFIX+code;
let hidden=new Set(store.get("zm_hidden_"+code,[]));
let starred=new Set(store.get("zm_star_"+code,[]));
let clearedAt=store.get("zm_cleared_"+code,0);
let items=[]; const seen=new Set();
let paused=false, queue=[], es=null, lastPromptSent=null;

function baseUrl(){
  if(location.protocol==="file:") return store.get("zm_base","");
  return location.origin+location.pathname;
}
function studentUrl(){const b=baseUrl(); return b? b+"?r="+code+(sfx?"&les="+lesId:"") : ""}
function drawQr(){
  const el=$("qr"); el.innerHTML="";
  const u=studentUrl();
  $("filewarn").classList.toggle("hidden", location.protocol!=="file:" || !!store.get("zm_base",""));
  if(!u){el.innerHTML='<div style="width:230px;height:230px;display:grid;place-items:center;color:#888;text-align:center;font-size:14px">QR verschijnt zodra<br>de pagina online staat</div>';$("link").textContent="";return}
  new QRCode(el,{text:u,width:460,height:460,correctLevel:QRCode.CorrectLevel.M});
  $("link").textContent=u;
}
$("baseurl").value=store.get("zm_base","");
$("baseurl").addEventListener("change",e=>{store.set("zm_base",e.target.value.trim());drawQr()});

function render(){
  const vis=items.filter(i=>!hidden.has(i.id)&&i.time>clearedAt);
  $("count").textContent=vis.length;
  $("empty").classList.toggle("hidden",vis.length>0);
  const wall=$("wall");
  const have=new Set([...wall.children].map(c=>c.dataset.id));
  // verwijder kaarten die niet meer zichtbaar zijn
  [...wall.children].forEach(c=>{if(!vis.find(v=>v.id===c.dataset.id)) c.remove()});
  // voeg nieuwe vooraan toe (nieuwste bovenaan)
  vis.slice().sort((a,b)=>a.time-b.time).forEach(it=>{
    if(have.has(it.id)) {wall.querySelector('[data-id="'+it.id+'"]').classList.toggle("star",starred.has(it.id));return}
    const c=document.createElement("article");
    c.className="card"+(starred.has(it.id)?" star":"");
    c.dataset.id=it.id;
    c.innerHTML='<div class="z">'+esc(it.zin)+'</div><div class="n"><span class="who">'+esc(it.naam||"")+'</span><span class="acts"><button data-a="spot" title="Groot tonen">🔍</button><button data-a="star" title="Markeren">★</button><button data-a="hide" title="Verbergen">✕</button></span></div>';
    wall.prepend(c);
    if(it.fresh){c.classList.add("new");setTimeout(()=>c.classList.remove("new"),4000)}
  });
}
$("wall").addEventListener("click",e=>{
  const b=e.target.closest("button"); const card=e.target.closest(".card"); if(!card) return;
  const id=card.dataset.id; const it=items.find(i=>i.id===id);
  const a=b?b.dataset.a:"spot";
  if(a==="hide"){hidden.add(id);store.set("zm_hidden_"+code,[...hidden]);render()}
  else if(a==="star"){starred.has(id)?starred.delete(id):starred.add(id);store.set("zm_star_"+code,[...starred]);render()}
  else {$("spotText").textContent=it.zin;$("spot").classList.remove("hidden")}
});
$("spot").addEventListener("click",e=>{if(e.target.id==="spot")$("spot").classList.add("hidden")});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("spot").classList.add("hidden")});

function add(m,fresh){
  const d=parse(m); if(!d||d.t!=="zin"||!d.zin) return;
  const id=d.id||m.id; if(seen.has(id)) return; seen.add(id);
  const it={id,zin:String(d.zin).slice(0,400),naam:String(d.naam||"").slice(0,40),time:m.time*1000,fresh};
  if(paused&&fresh){queue.push(it);$("bPause").textContent="Pauze ("+queue.length+")";return}
  items.push(it); render();
}
function connect(){
  if(es) es.close();
  $("dot").classList.remove("on"); $("stat").textContent="Verbinden…";
  let initial=true; setTimeout(()=>initial=false,2500);
  es=listen(topic,m=>add(m,!initial),st=>{
    $("dot").classList.toggle("on",st!=="down");
    $("stat").textContent= st==="live"?"Live: nieuwe "+L.meerv+" verschijnen vanzelf"
      : st==="poll"?"Verbonden: nieuwe "+L.meerv+" verschijnen binnen enkele seconden"
      : "Geen verbinding met de zinnendienst (ntfy.sh). Zie uitleg.";
  });
}

// opdracht naar de gsm's sturen (na korte pauze in het typen)
let pt; const promptEl=$("prompt");
promptEl.textContent=store.get("zm_prompt_"+code,L.opdracht);
promptEl.addEventListener("input",()=>{
  clearTimeout(pt);
  pt=setTimeout(()=>{const t=promptEl.textContent.trim(); store.set("zm_prompt_"+code,t);
    if(t!==lastPromptSent){lastPromptSent=t; post(topic,{t:"opdracht",tekst:t}).catch(()=>{})}},1200);
});
promptEl.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();promptEl.blur()}});

// knoppen
function toggle(btn,on){btn.classList.toggle("on",on)}
$("bQr").onclick=()=>{const s=$("side").classList.toggle("hidden");$("screen").classList.toggle("noqr",s);toggle($("bQr"),!s)};
$("bNames").onclick=()=>{const n=$("screen").classList.toggle("nonames");toggle($("bNames"),!n)};
$("bPause").onclick=()=>{paused=!paused;toggle($("bPause"),paused);
  if(!paused){queue.forEach(i=>items.push(i));queue=[];render();$("bPause").textContent="Pauze"}};
$("bFull").onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})};
$("bCopy").onclick=async()=>{
  const vis=items.filter(i=>!hidden.has(i.id)&&i.time>clearedAt).sort((a,b)=>a.time-b.time);
  const t=(promptEl.textContent.trim()?promptEl.textContent.trim()+"\n\n":"")+vis.map(i=>"- "+i.zin+(i.naam?" ("+i.naam+")":"")).join("\n");
  try{await navigator.clipboard.writeText(t);$("bCopy").textContent="Gekopieerd ✓"}catch(e){$("bCopy").textContent="Kopiëren mislukt"}
  setTimeout(()=>$("bCopy").textContent="Kopieer alles",2000);
};
$("bClear").onclick=()=>{if(!confirm("Alle "+L.meerv+" van de muur halen? (De QR-code blijft dezelfde.)"))return;
  clearedAt=Date.now();store.set("zm_cleared_"+code,clearedAt);render()};
$("bNew").onclick=()=>{if(!confirm("Nieuwe sessie starten? Er komt een nieuwe QR-code en de muur is leeg."))return;
  code=rid(10);store.set("zm_room"+sfx,code);topic=PREFIX+code;hidden=new Set();starred=new Set();clearedAt=0;
  items=[];seen.clear();$("wall").innerHTML="";promptEl.textContent=L.opdracht;lastPromptSent=null;drawQr();render();connect()};

drawQr(); render(); connect();
})();
</script>
</body>
</html>
